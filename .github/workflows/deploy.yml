name: Deploy Hugo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('hugo.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # 2026-05-08_JHKim : peaceiris/actions-hugo 제거 (내부 GitHub API 호출 실패로 exit 1 발생)
      #                     GITHUB_TOKEN 인증 API로 최신 Hugo extended 버전 직접 설치
      - name: Install Hugo Extended
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HUGO_VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | grep '"tag_name"' \
            | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Hugo ${HUGO_VERSION} 설치 중..."
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
