baseURL = "https://jonghwan-dev.github.io/"
locale = "ko-KR"
title = "ArmyKim_space"
theme = "stack"
hasCJKLanguage = true
# 2026-05-08_JHKim : robots.txt 자동 생성 (Sitemap URL 포함) — 구글 사이트맵 인식 오류 해결
enableRobotsTxt = true

[pagination]
  pagerSize = 10

[services]
  # 2026-05-08_JHKim : GA4 측정 ID — Stack 테마 내장 지원, 빌드 시 자동으로 gtag.js 삽입
  [services.googleAnalytics]
    ID = "G-09ZRY73S9F"

[params]
  mainSections = ["post"]
  featuredImageField = "image"
  rssFullContent = true

  [params.footer]
    since = 2024

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02 15:04 MST"

  [params.colorScheme]
    toggle  = true      # true = 토글 버튼 표시
    default = "auto"    # "auto" | "light" | "dark"

  [params.google]
    siteVerification  = "GLB174ggtv69Dkosu23msmQLolVh8aj5k9fQ-kuSSKE"
    adsensePublisherID = "" # ca-pub-XXXXXXXXXXXXXXXX : AdSense 승인 후 입력

  # 2026-05-08_JHKim : 네이버 서치어드바이저 소유권 인증 코드
  [params.naver]
    siteVerification = "0214843e2f6c14abe5c721027a85147a1ad61fc6"

  [params.sidebar]
    emoji    = "👋"
    subtitle = "흔한 개발자의 기술블로그"
    avatar = "img/avatar.png"

  [params.social]
    hideGitHub = false

  [params.article]
    math        = false
    toc         = true
    readingTime = true

  [params.article.license]
    enabled = false
    default = ""

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
    ]

  [params.comments]
    enabled  = true
    provider = "giscus"

  [params.comments.giscus]
    repo             = "jonghwan-dev/jonghwan-dev.github.io"
    repoID           = "R_kgDOSB8O0Q"
    category         = "Announcements"
    categoryID       = "DIC_kwDOSB8O0c4C6zRB"
    mapping          = "pathname"
    lightTheme       = "light"
    darkTheme        = "dark_dimmed"
    reactionsEnabled = 1
    emitMetadata     = 0
    inputPosition    = "bottom"
    lang             = "ko"
    strict           = 0
    loading          = "lazy"

[menu]
  [[menu.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = 1
    params     = { icon = "home" }

